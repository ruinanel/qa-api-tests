name: API tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # ночной прогон каждый день в 03:00 UTC

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff (линтер)
        run: ruff check .
      - name: Ruff format (проверка стиля)
        run: ruff format --check .
      - name: Mypy (проверка типов)
        run: mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]   # проверяем на нескольких версиях Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (parallel)
        run: pytest -v -n auto
