name: Allure report

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # обновлять отчёт ночью

permissions:
  contents: write          # нужно, чтобы публиковать в ветку gh-pages

jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (собираем allure-results)
        run: pytest --alluredir=allure-results
        continue-on-error: true   # отчёт нужен и когда тесты упали

      - name: Load previous history (если ветка gh-pages уже есть)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Copy previous history into results (для трендов)
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/* allure-results/history/ || true
          fi

      - name: Set up Java (нужна для Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
